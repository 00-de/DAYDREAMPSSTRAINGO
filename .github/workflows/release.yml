# ─────────────────────────────────────────────
#  Setup.exe を自動で作って GitHub Releases に公開する
#
#  使い方: package.json の version を上げて Push するだけ
#  手動実行: Actions → 左の「Build & Release (Windows)」→ 右上「Run workflow」
#
#  公開先は GitHub から自動で受け取るため、リポジトリ名の設定は不要。
# ─────────────────────────────────────────────
name: Build & Release (Windows)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: ソースを取得
        uses: actions/checkout@v4

      - name: Node.js を用意
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 依存関係をインストール
        run: npm install

      - name: バージョンを読み取る
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: 同じバージョンの Release があるか確認
        id: exists
        shell: bash
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 公開先を package.json に書き込む。
      # コマンド行で渡すとシェルの解釈で壊れるため、ファイルに直接書く。
      - name: 公開先を設定
        if: steps.exists.outputs.found == 'false'
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.repository = { type: 'git', url: 'https://github.com/${{ github.repository }}.git' };
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
            console.log('公開先: ${{ github.repository }}');
          "

      # ここで落ちたら型エラー
      - name: 画面をビルド
        if: steps.exists.outputs.found == 'false'
        run: npm run build:web
        env:
          VITE_FB_API_KEY: ${{ secrets.VITE_FB_API_KEY }}
          VITE_FB_AUTH_DOMAIN: ${{ secrets.VITE_FB_AUTH_DOMAIN }}
          VITE_FB_PROJECT_ID: ${{ secrets.VITE_FB_PROJECT_ID }}
          VITE_FB_STORAGE_BUCKET: ${{ secrets.VITE_FB_STORAGE_BUCKET }}
          VITE_FB_SENDER_ID: ${{ secrets.VITE_FB_SENDER_ID }}
          VITE_FB_APP_ID: ${{ secrets.VITE_FB_APP_ID }}

      # ここで落ちたらアイコンか署名
      - name: Setup.exe を作って公開
        if: steps.exists.outputs.found == 'false'
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 公開済みの場合の案内
        if: steps.exists.outputs.found == 'true'
        run: echo "v${{ steps.ver.outputs.version }} は公開済みです。package.json の version を上げてください。"
